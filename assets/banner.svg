<svg width="920" height="280" viewBox="0 0 920 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guilherme Araújo, dev backend Java e Spring. O que acontece depois do clique.">
  <rect width="920" height="280" fill="#15110a"/>

  <!-- identidade -->
  <text x="48" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#f2ecdc" letter-spacing="-1.5">Guilherme Araújo</text>
  <text x="48" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#b8ae98">Dev backend Java e Spring. Vim do design.</text>
  <rect x="46" y="150" width="290" height="26" fill="#fbe311"/>
  <text x="54" y="169" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#15110a">o que acontece depois do clique</text>
  <text x="48" y="232" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#8a7f68">São Paulo, procurando estágio ou primeira vaga em backend</text>

  <!-- trace: as camadas do portfólio, cada span uma barra -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#b8ae98">
    <rect x="560" y="30" width="316" height="226" fill="none" stroke="#3a3223"/>
    <text x="576" y="54" fill="#f2ecdc">trace <tspan fill="#8a7f68">depois-do-clique</tspan></text>
    <line x1="560" y1="66" x2="876" y2="66" stroke="#3a3223"/>
    <text x="576" y="88">interface</text><rect x="690" y="78" width="14" height="12" fill="#fbe311"/>
    <text x="576" y="112">contrato</text><rect x="700" y="102" width="36" height="12" fill="#fbe311"/><text x="846" y="112">201</text>
    <text x="576" y="136">domínio</text><rect x="730" y="126" width="22" height="12" fill="#fbe311"/>
    <text x="576" y="160">persistência</text><rect x="750" y="150" width="18" height="12" fill="#fbe311"/>
    <text x="576" y="184">fila</text><rect x="764" y="174" width="30" height="12" fill="#fbe311"/><text x="846" y="184">202</text>
    <text x="576" y="208">rota</text><rect x="790" y="198" width="10" height="12" fill="#fbe311"/>
    <text x="576" y="232">resposta</text><rect x="798" y="222" width="8" height="12" fill="#fbe311"/><text x="846" y="232">200</text>
  </g>
</svg>
